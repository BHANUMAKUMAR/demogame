name: Demo Game CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Game File Exists
        run: test -f game.html

      - name: Success Message
        run: echo "Game file found successfully"
