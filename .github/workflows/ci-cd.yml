name: Game CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Files
        run: ls -la

      - name: Verify HTML Exists
        run: test -f index.html

      - name: Success Message
        run: echo "Website validation successful"
